<title>Absensi Cafe</title>
<script>
/* <head> dibuat oleh pembungkus halaman, jadi meta viewport & bahasa dipasang dari sini
   supaya file ini juga benar saat dibuka langsung di HP. */
(function(){
  document.documentElement.lang = "id";
  function tambah(tag, atts){
    var el = document.createElement(tag);
    for(var k in atts) el.setAttribute(k, atts[k]);
    document.head.appendChild(el);
  }
  if(!document.querySelector('meta[name="viewport"]'))
    tambah("meta", { name:"viewport", content:"width=device-width, initial-scale=1, viewport-fit=cover" });
  if(!document.querySelector('link[rel="manifest"]'))
    tambah("link", { rel:"manifest", href:"manifest.webmanifest" });
  // warna bilah status mengikuti tema perangkat
  if(!document.querySelector('meta[name="theme-color"]')){
    tambah("meta", { name:"theme-color", media:"(prefers-color-scheme: dark)",  content:"#0C110D" });
    tambah("meta", { name:"theme-color", media:"(prefers-color-scheme: light)", content:"#F0F2EE" });
  }
  if(!document.querySelector('link[rel="icon"]'))
    tambah("link", { rel:"icon", type:"image/png", href:"icon-192.png" });
})();
</script>
<style>
:root{
  --bg:#F0F2EE; --bg2:#E5E9E1; --surface:#FFFFFF; --line:#D9DED4; --line2:#C1C9B8;
  --text:#161C15; --muted:#5E6A5C; --faint:#8A958A;
  --accent:#B5761B; --accent-ink:#7A4E0C; --accent-soft:#F7ECD9;
  --ok:#1C8A52; --ok-soft:#DEF0E5;
  --late:#B93A57; --late-soft:#FADFE5;
  --ot:#0D7A87; --ot-soft:#D8EFF2;
  --off:#77826F; --off-soft:#E7EAE3;
  --shadow:0 1px 2px rgba(20,28,18,.06), 0 8px 24px -12px rgba(20,28,18,.18);
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,SFMono-Regular,"DejaVu Sans Mono","Droid Sans Mono",Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0C110D; --bg2:#111713; --surface:#161D18; --line:#242D26; --line2:#354034;
    --text:#E7EDE6; --muted:#97A396; --faint:#6B776A;
    --accent:#E0A544; --accent-ink:#F2C67E; --accent-soft:#2B2216;
    --ok:#3FC486; --ok-soft:#12291E;
    --late:#F0798F; --late-soft:#2D161C;
    --ot:#48C3CF; --ot-soft:#0F2427;
    --off:#7E8A7C; --off-soft:#1C221D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="light"]{
  --bg:#F0F2EE; --bg2:#E5E9E1; --surface:#FFFFFF; --line:#D9DED4; --line2:#C1C9B8;
  --text:#161C15; --muted:#5E6A5C; --faint:#8A958A;
  --accent:#B5761B; --accent-ink:#7A4E0C; --accent-soft:#F7ECD9;
  --ok:#1C8A52; --ok-soft:#DEF0E5; --late:#B93A57; --late-soft:#FADFE5;
  --ot:#0D7A87; --ot-soft:#D8EFF2; --off:#77826F; --off-soft:#E7EAE3;
  --shadow:0 1px 2px rgba(20,28,18,.06), 0 8px 24px -12px rgba(20,28,18,.18);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0C110D; --bg2:#111713; --surface:#161D18; --line:#242D26; --line2:#354034;
  --text:#E7EDE6; --muted:#97A396; --faint:#6B776A;
  --accent:#E0A544; --accent-ink:#F2C67E; --accent-soft:#2B2216;
  --ok:#3FC486; --ok-soft:#12291E; --late:#F0798F; --late-soft:#2D161C;
  --ot:#48C3CF; --ot-soft:#0F2427; --off:#7E8A7C; --off-soft:#1C221D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.shell{max-width:520px;margin-inline:auto;padding:0 14px calc(84px + env(safe-area-inset-bottom))}

/* ---- header ---- */
.top{padding:18px 2px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{min-width:0}
.brand h1{margin:0;font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);text-wrap:balance;overflow-wrap:anywhere}
.brand .date{margin-top:3px;font-size:12.5px;color:var(--muted)}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700;
  font-size:30px;letter-spacing:-.02em;line-height:1;text-align:right;white-space:nowrap}
.clock .sec{font-size:15px;font-weight:500;color:var(--faint);margin-left:1px}

/* ---- generic ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--line);border:0;margin:0}
.dash{border:0;border-top:1px dashed var(--line2);margin:0}

/* ---- summary strip ---- */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.strip div{background:var(--surface);padding:9px 6px 10px;text-align:center}
.strip b{display:block;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:700;line-height:1.1}
.strip span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.strip .v-ok b{color:var(--ok)} .strip .v-late b{color:var(--late)} .strip .v-off b{color:var(--off)}

/* ---- employee grid ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emp{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 11px 11px;text-align:left;cursor:pointer;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;transition:transform .12s ease,border-color .12s ease}
.emp:active{transform:scale(.975)}
.emp[data-state="kerja"]{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.emp[data-state="alert"]{border-color:color-mix(in srgb,var(--late) 45%,var(--line))}
.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--bg2);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--muted);flex:none}
.emp .nm{font-weight:600;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.emp .ro{font-size:11.5px;color:var(--muted);line-height:1.3}
.emp .sch{font-family:var(--f-mono);font-size:11px;color:var(--faint);letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.c-belum{background:var(--off-soft);color:var(--off)}
.c-kerja{background:var(--ok-soft);color:var(--ok)}
.c-selesai{background:var(--accent-soft);color:var(--accent-ink)}
.c-telat{background:var(--late-soft);color:var(--late)}
.c-ot{background:var(--ot-soft);color:var(--ot)}
.c-shift{background:var(--accent-soft);color:var(--accent-ink)}
.c-shift::before{display:none}
.c-kerja::before{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);
  background:var(--surface);color:var(--text);border-radius:11px;padding:11px 14px;font-weight:600;font-size:14px;
  cursor:pointer;text-align:center;transition:transform .1s ease}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1B1305;font-weight:700}
:root[data-theme="dark"] .btn.pri,.btn.pri{color:#201606}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.dgr{background:transparent;border-color:color-mix(in srgb,var(--late) 55%,var(--line));color:var(--late)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.blk{width:100%}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btnrow{display:flex;gap:8px}
.btnrow>*{flex:1}

/* ---- tabs ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:520px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr;gap:0}
.nav button{background:none;border:0;padding:11px 0 12px;cursor:pointer;color:var(--muted);
  font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  border-top:2px solid transparent;margin-top:-1px}
.nav button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}

/* ---- segmented ---- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--bg2);
  border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:14px}
.seg button{background:none;border:0;padding:8px 4px;border-radius:8px;cursor:pointer;color:var(--muted);
  font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.seg button[aria-current="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* ---- forms ---- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}
.field .hint{font-size:11.5px;color:var(--muted);line-height:1.4}
input[type=text],input[type=time],input[type=number],input[type=month],input[type=date],input[type=password],select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:15px}
input[type=time],input[type=number],input[type=month],input[type=date]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:64px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0}
.sw{width:46px;height:27px;border-radius:999px;background:var(--line2);border:0;position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--ok)}
.sw[aria-pressed="true"]::after{transform:translateX(19px)}

/* ---- jadwal / roster ---- */
.wknav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wklbl{flex:1;text-align:center;line-height:1.25}
.wklbl b{display:block;font-size:14.5px;font-weight:700}
.wklbl span{font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.wknav .btn{flex:0 0 42px;font-size:20px;line-height:1;padding:8px 0}

table.roster th,table.roster td{padding:0;text-align:center}
table.roster th:first-child,table.roster td:first-child{text-align:left;padding:8px 10px;min-width:104px}
table.roster td:first-child{cursor:pointer;font-size:13px;font-weight:600;line-height:1.2}
.rowhint{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);font-weight:600;margin-top:2px}
.dayhead{cursor:pointer;padding:6px 4px!important;min-width:42px;line-height:1.25}
.dayhead span{font-size:12px;color:var(--muted);font-weight:700}
.dayhead.kini{color:var(--accent);background:var(--accent-soft)}
.dayhead.kini span{color:var(--accent-ink)}
td.cell{cursor:pointer;font-family:var(--f-mono);font-weight:700;font-size:14px;
  padding:11px 4px!important;min-width:42px;border-left:1px solid var(--line)}
td.cell.ada{background:var(--accent-soft);color:var(--accent-ink)}
td.cell.off{background:var(--off-soft);color:var(--off)}
td.cell.kosong{color:var(--line2)}
td.cell.kini{box-shadow:inset 0 0 0 1.5px var(--accent)}
td.cell:active{filter:brightness(.93)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:11px;font-size:11.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;flex:none;
  font-family:var(--f-mono);font-size:11px;font-weight:700}
.lg.ada{background:var(--accent-soft);color:var(--accent-ink)}
.lg.off{background:var(--off-soft);color:var(--off)}
.lg.kosong{background:var(--bg2);color:var(--line2);border:1px solid var(--line)}

.shlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.shopt{display:flex;align-items:center;gap:11px;padding:12px;background:var(--surface);border:0;
  text-align:left;cursor:pointer;width:100%;color:inherit}
.shopt:active{background:var(--bg2)}
.shopt .grow{display:flex;flex-direction:column;gap:2px}
.shn{font-weight:600;font-size:14.5px}
.shr{font-size:11.5px;color:var(--muted)}

/* ---- baris status luring ---- */
.stat2{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.statrow{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface)}
.dot2{width:9px;height:9px;border-radius:50%;flex:none}
.dot2.ok{background:var(--ok)}
.dot2.warn{background:var(--accent)}
.dot2.off{background:var(--off)}
.statnm{font-weight:600;font-size:14px}
.statv{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:1px}

/* ---- tingkatan denda ---- */
.tiers{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.tier{background:var(--surface);padding:10px 12px 11px;display:flex;flex-direction:column;gap:7px}
.tier-lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);font-weight:600}
.tier-in{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tier-sub{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.tier-sub input{width:82px;padding:7px 9px;font-size:14px}
.tier-open{font-size:11px;color:var(--faint);letter-spacing:.04em}
.tier-del{margin-left:auto;background:none;border:1px solid var(--line);color:var(--late);
  width:30px;height:30px;border-radius:8px;font-size:17px;line-height:1;cursor:pointer;flex:none}
.tier-del:active{background:var(--late-soft)}

/* ---- list rows (receipt) ---- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:11px;padding:11px 12px;width:100%;background:none;border:0;
  border-bottom:1px dashed var(--line2);text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item .t1{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.item .t2{font-size:11.5px;color:var(--muted);margin-top:1px}
.tm{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600;white-space:nowrap}

/* ---- table ---- */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:9px 10px;text-align:right;border-bottom:1px dashed var(--line2)}
th{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  font-weight:600;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);
  box-shadow:1px 0 0 var(--line);max-width:130px;overflow:hidden;text-overflow:ellipsis}
th:first-child{background:var(--bg2)}
tbody tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tfoot td{border-top:1px solid var(--line);border-bottom:0;background:var(--bg2)}
tfoot td:first-child{background:var(--bg2)}

/* ---- empty / notes ---- */
.empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:13.5px;line-height:1.6}
.empty .big{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.note{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);
  border-radius:11px;padding:11px 12px;font-size:12.5px;line-height:1.5;color:var(--text)}
.note.warn{background:var(--late-soft);border-color:color-mix(in srgb,var(--late) 32%,transparent)}
.sect{margin:20px 0 9px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sect h2{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
/* padding besar untuk area sentuh jempol, margin negatif agar tata letak tetap rapat */
.sortbtn{background:none;border:0;padding:13px 2px 7px 14px;margin:-13px -2px -7px 0;
  cursor:pointer;white-space:nowrap;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:600;color:var(--accent)}
.sortbtn:active{opacity:.55}
th[data-act="sortname"]{cursor:pointer;color:var(--accent)}
th[data-act="sortname"]:active{background:var(--accent-soft)}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(8,12,8,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim.pin{z-index:70}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--bg);
  border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.handle{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:6px auto 12px}
.sheet h3{margin:0 0 3px;font-size:18px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}

/* ---- pin ---- */
.pindots{display:flex;gap:11px;justify-content:center;margin:18px 0 20px}
.pindot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line2)}
.pindot.on{background:var(--accent);border-color:var(--accent)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.keys button{padding:16px 0;font-family:var(--f-mono);font-size:21px;font-weight:600;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;cursor:pointer}
.keys button:active{background:var(--bg2)}
.keys .aux{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---- camera ---- */
.cam{position:fixed;inset:0;z-index:60;background:#070907;display:flex;flex-direction:column}
.cam .chead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#EDF1EA}
.cam .chead .t{flex:1;min-width:0}
.cam .chead .n{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.cam .chead .a{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#E0A544}

<script>
"use strict";
/* ============================================================
   Absensi Cafe — kiosk absensi satu HP dengan verifikasi wajah
   Semua data tersimpan di HP ini (localStorage + IndexedDB).
   ============================================================ */

/* ---------- util ---------- */
const $ = s => document.querySelector(s);
const el = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAYS = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const dkey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseHM = s => { const [a,b] = String(s||"0:0").split(":").map(Number); return (a||0)*60+(b||0); };
const hm = ts => { const d = new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const fmtDur = m => { m = Math.max(0,Math.round(m||0)); return `${Math.floor(m/60)}j ${pad(m%60)}m`; };
const fmtJam = m => (Math.max(0,m||0)/60).toFixed(1).replace(".",",");
const rupiah = n => "Rp " + Math.round(Number(n)||0).toLocaleString("id-ID");
const longDate = k => { const [y,m,d] = k.split("-").map(Number); const dt = new Date(y,m-1,d);
  return `${DAYS[dt.getDay()]}, ${d} ${MONTHS[m-1]} ${y}`; };
const shortDate = k => { const [y,m,d] = k.split("-").map(Number); const dt = new Date(y,m-1,d);
  return `${DAYS[dt.getDay()]} ${pad(d)}/${pad(m)}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const initials = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();

/* ---------- penyimpanan ---------- */
const LS = "absensi_cafe_v1";
let storageOK = true;
const DEFAULTS = {
  settings:{ cafeName:"Absensi Cafe", pin:"1234", tolerance:10, minOvertime:30,
             pinMode:"wajib",
             faceMode:"off", faceThreshold:65, retention:60,
             fineEnabled:true,
             fineTiers:[ {upTo:15, amount:5000}, {upTo:30, amount:15000}, {upTo:null, amount:30000} ],
             geoMode:"off", geoLat:null, geoLon:null, geoRadius:100,
             sortDir:"asc" },
  shifts:[
    { id:"sh-pagi",  code:"P", name:"Pagi",  start:"07:00", end:"15:00" },
    { id:"sh-sore",  code:"S", name:"Sore",  start:"15:00", end:"23:00" },
    { id:"sh-malam", code:"M", name:"Malam", start:"23:00", end:"07:00" }
  ],
  employees:[],
  roster:{},        /* { "2026-08-11": { "<idKaryawan>": "<idShift>" | "off" } } */
  records:[]
};
let db = JSON.parse(JSON.stringify(DEFAULTS));

function loadDB(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw){ const p = JSON.parse(raw);
      db.settings  = Object.assign({}, DEFAULTS.settings, p.settings||{});
      db.employees = Array.isArray(p.employees) ? p.employees : [];
      db.records   = Array.isArray(p.records)  ? p.records  : [];
      db.shifts    = Array.isArray(p.shifts) && p.shifts.length ? p.shifts : [];
      db.roster    = (p.roster && typeof p.roster === "object") ? p.roster : {};
      /* Pencocokan wajah terbukti tidak andal di lapangan: wajah yang sama
         ditolak begitu orangnya berdiri sedikit bergeser atau lebih tinggi.
         Pemasangan lama dialihkan ke PIN pribadi, dan verifikasi wajah
         dimatikan sekali saja saat naik versi. */
      if(p.settings && p.settings.pinMode === undefined) db.settings.faceMode = "off";
      migrateToRoster(!p.shifts);
    }
  }catch(e){ storageOK = false; }
}

/* Versi awal menyimpan jadwal tetap di tiap karyawan (jamMasuk/jamPulang/days).
   Sekarang jadwal ditentukan per tanggal lewat roster, jadi jadwal lama diubah
   menjadi daftar shift dan ditulis ke roster agar catatan lama tetap benar. */
function migrateToRoster(perluMigrasi){
  if(!db.shifts.length) db.shifts = JSON.parse(JSON.stringify(DEFAULTS.shifts));
  bersihkanRoster();
  if(!perluMigrasi) return;

  const namaDari = h => { const m = parseHM(h);
    return m < 11*60 ? "Pagi" : m < 15*60 ? "Siang" : m < 19*60 ? "Sore" : "Malam"; };
  const kodeUnik = nama => {
    let c = nama[0].toUpperCase(), n = 2;
    while(db.shifts.some(s => s.code === c)) c = nama[0].toUpperCase() + (n++);
    return c;
  };
  const lama = db.employees.filter(e => e.jamMasuk && e.jamPulang);
  if(!lama.length) return;

  db.shifts = [];
  const petaShift = new Map();
  for(const e of lama){
    const kunci = e.jamMasuk + "-" + e.jamPulang;
    if(!petaShift.has(kunci)){
      const nama = namaDari(e.jamMasuk);
      const sh = { id:uid(), code:kodeUnik(nama), name:nama, start:e.jamMasuk, end:e.jamPulang };
      db.shifts.push(sh);
      petaShift.set(kunci, sh.id);
    }
  }

  // isi roster dari pola hari kerja lama, mencakup semua tanggal yang sudah ada
  // catatan absennya sampai akhir bulan berjalan
  const tanggalCatatan = db.records.map(r => r.date).sort();
  const now = new Date();
  const awalBulan = dkey(new Date(now.getFullYear(), now.getMonth(), 1));
  const akhirBulan = dkey(new Date(now.getFullYear(), now.getMonth()+1, 0));
  const dari = tanggalCatatan.length && tanggalCatatan[0] < awalBulan ? tanggalCatatan[0] : awalBulan;
  const sampai = tanggalCatatan.length && tanggalCatatan[tanggalCatatan.length-1] > akhirBulan
    ? tanggalCatatan[tanggalCatatan.length-1] : akhirBulan;

  const [fy,fm,fd] = dari.split("-").map(Number);
  const [ty,tm,td] = sampai.split("-").map(Number);
  const akhir = new Date(ty, tm-1, td);
  for(let d = new Date(fy, fm-1, fd); d <= akhir; d.setDate(d.getDate()+1)){
    const k = dkey(d), hari = d.getDay();
    for(const e of lama){
      const sid = petaShift.get(e.jamMasuk + "-" + e.jamPulang);
      const kerja = Array.isArray(e.days) ? !!e.days[hari] : true;
      if(!db.roster[k]) db.roster[k] = {};
      if(db.roster[k][e.id] === undefined) db.roster[k][e.id] = kerja ? sid : "off";
    }
  }
  save();
}
let saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{
    try{ localStorage.setItem(LS, JSON.stringify(db)); }
    catch(e){ storageOK = false; toast("Penyimpanan penuh — hapus foto lama di Pengaturan"); }
  },60);
}

/* foto disimpan di IndexedDB agar tidak membebani localStorage */
const memPhotos = new Map();
let idbP;
function idb(){
  if(idbP) return idbP;
  idbP = new Promise(res=>{
    let r; try{ r = indexedDB.open("absensi_cafe",1); }catch(e){ return res(null); }
    r.onupgradeneeded = () => { try{ r.result.createObjectStore("photos"); }catch(e){} };
    r.onsuccess = () => res(r.result);
    r.onerror = () => res(null);
    setTimeout(()=>res(null), 3000);
  });
  return idbP;
}
async function photoSet(k,v){
  const d = await idb();
  if(!d){ memPhotos.set(k,v); return; }
  return new Promise(res=>{
    try{ const t = d.transaction("photos","readwrite");
      t.objectStore("photos").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>{memPhotos.set(k,v);res();};
    }catch(e){ memPhotos.set(k,v); res(); }
  });
}
async function photoGet(k){
  const d = await idb();
  if(!d) return memPhotos.get(k) || null;
  return new Promise(res=>{
    try{ const t = d.transaction("photos","readonly"); const q = t.objectStore("photos").get(k);
      q.onsuccess = () => res(q.result || memPhotos.get(k) || null); q.onerror = () => res(null);
    }catch(e){ res(memPhotos.get(k)||null); }
  });
}
async function photoDel(k){
  memPhotos.delete(k);
  const d = await idb(); if(!d) return;
  try{ const t = d.transaction("photos","readwrite"); t.objectStore("photos").delete(k); }catch(e){}
}

/* ---------- jadwal, telat, lembur ---------- */
function tolOf(emp){ const t = emp.tolerance; return (t===null||t===undefined||t==="") ? db.settings.tolerance : Number(t); }

/* Denda keterlambatan bertingkat. Dihitung saat dibutuhkan, bukan disimpan di
   catatan, supaya perubahan tarif langsung berlaku konsisten di seluruh rekap. */
function tiers(){ return Array.isArray(db.settings.fineTiers) ? db.settings.fineTiers : []; }
function fineFor(lateMin){
  if(!db.settings.fineEnabled || !(lateMin > 0)) return 0;
  const ts = tiers();
  for(const t of ts){
    if(t.upTo === null || t.upTo === undefined || t.upTo === "" || lateMin <= Number(t.upTo)) return Number(t.amount) || 0;
  }
  return ts.length ? Number(ts[ts.length-1].amount) || 0 : 0;
}
function tierLabel(i){
  const ts = tiers(), t = ts[i], prev = i > 0 ? Number(ts[i-1].upTo) : 0;
  const from = (isNaN(prev) ? 0 : prev) + 1;
  if(t.upTo === null || t.upTo === undefined || t.upTo === "") return `Lebih dari ${from-1} menit`;
  return `${from}–${t.upTo} menit`;
}
/* ---------- PIN pribadi karyawan ----------
   Pengganti verifikasi wajah. Sederhana, tidak pernah menolak orang yang
   benar, dan celah titip absen tertutup karena PIN hanya diketahui pemiliknya.
   Foto selfie tetap diambil sebagai bukti utama. */
function pinWajib(){ return db.settings.pinMode !== "off"; }
function pinOf(emp){ const p = emp && emp.pin; return (p === null || p === undefined || p === "") ? null : String(p); }
function tanpaPin(){ return pinWajib() ? db.employees.filter(e => e.active !== false && !pinOf(e)) : []; }

/* Mengembalikan cara absen diloloskan: "pin", "kosong" (PIN belum diatur),
   "admin" (disetujui admin), "off" (fitur dimatikan), atau null bila dibatalkan. */
async function gerbangPin(emp, aksi){
  if(!pinWajib()) return "off";
  const asli = pinOf(emp);
  if(!asli) return "kosong";
  const label = aksi === "masuk" ? "absen masuk" : "absen pulang";
  for(let sisa = 3; sisa > 0; sisa--){
    const p = await askPin(emp.name, sisa === 3
      ? `Masukkan PIN pribadi untuk ${label}`
      : `PIN salah — sisa ${sisa} percobaan`);
    if(p === null) return null;
    if(p === asli) return "pin";
  }
  const a = await askPin("Izin Admin",
    "PIN karyawan salah 3 kali. Masukkan PIN admin bila absen ini tetap sah.");
  if(a === null) return null;
  if(a === String(db.settings.pin)) return "admin";
  toast("PIN admin salah");
  return null;
}
const LABEL_PIN = { pin:"", kosong:"tanpa PIN", admin:"izin admin", off:"" };

/* ---------- urutan nama ----------
   Satu arah urut dipakai di semua daftar karyawan agar posisi nama sama
   di layar absen, jadwal, daftar orang, dan rekap. */
function byName(a, b){
  const r = String(a.name||"").localeCompare(String(b.name||""), "id",
    { sensitivity:"base", numeric:true });
  return db.settings.sortDir === "desc" ? -r : r;
}
function sortedEmps(list){ return (list || db.employees).slice().sort(byName); }
function sortLabel(){ return db.settings.sortDir === "desc" ? "Nama Z–A" : "Nama A–Z"; }
function sortArrow(){ return db.settings.sortDir === "desc" ? "↓" : "↑"; }

/* ---------- roster: jadwal shift per tanggal ---------- */
function shiftById(id){ return (db.shifts || []).find(s => s.id === id) || null; }
/* Buang entri yang menunjuk shift atau karyawan yang sudah tidak ada, agar
   jumlah sel terisi selalu cocok dengan yang tampil di grid. */
function bersihkanRoster(){
  if(!db.roster) { db.roster = {}; return; }
  for(const k of Object.keys(db.roster)){
    for(const empId of Object.keys(db.roster[k])){
      const v = db.roster[k][empId];
      const adaOrang = db.employees.some(e => e.id === empId);
      if(!adaOrang || (v !== "off" && !shiftById(v))) delete db.roster[k][empId];
    }
    if(!Object.keys(db.roster[k]).length) delete db.roster[k];
  }
}
function shiftSpan(sh){ const n = (parseHM(sh.end) - parseHM(sh.start) + 1440) % 1440; return n || 1440; }
function shiftRange(sh){ return `${sh.start}–${sh.end}`; }

/* Tiga keadaan berbeda: ada shift, libur (ditandai admin), atau belum dijadwalkan. */
function rosterRaw(dateKey, empId){
  const hari = db.roster && db.roster[dateKey];
  return hari ? hari[empId] : undefined;
}
function shiftOn(emp, dateKey){
  const v = rosterRaw(dateKey, emp.id);
  return (!v || v === "off") ? null : shiftById(v);
}
function isLibur(emp, dateKey){ return rosterRaw(dateKey, emp.id) === "off"; }
function setRoster(dateKey, empId, value){
  if(!db.roster) db.roster = {};
  if(value === null){
    if(db.roster[dateKey]){
      delete db.roster[dateKey][empId];
      if(!Object.keys(db.roster[dateKey]).length) delete db.roster[dateKey];
    }
  }else{
    if(!db.roster[dateKey]) db.roster[dateKey] = {};
    db.roster[dateKey][empId] = value;
  }
}
function schedule(emp, dateKey){
  const sh = shiftOn(emp, dateKey);
  if(!sh) return null;
  const [y,m,d] = dateKey.split("-").map(Number);
  const start = new Date(y, m-1, d, 0, 0, 0, 0);
  start.setMinutes(parseHM(sh.start));
  const span = shiftSpan(sh);
  return { start, end:new Date(start.getTime() + span*60000), span, shift:sh };
}
function recalc(rec){
  const emp = db.employees.find(e => e.id === rec.empId);
  if(!emp) return rec;
  const s = schedule(emp, rec.date);
  rec.shiftId = s ? s.shift.id : null;
  rec.workMin = rec.outAt ? Math.max(0, Math.round((rec.outAt - rec.inAt)/60000)) : 0;
  if(!s){
    // absen di hari yang tidak dijadwalkan: durasi tetap dihitung, telat dan
    // lembur tidak, karena tidak ada jam acuan
    rec.offSchedule = true;
    rec.lateMin = 0; rec.earlyMin = 0; rec.otMin = 0;
    return rec;
  }
  rec.offSchedule = false;
  rec.lateMin = rec.inAt ? Math.max(0, Math.round((rec.inAt - s.start.getTime())/60000) - tolOf(emp)) : 0;
  if(rec.outAt){
    rec.earlyMin = Math.max(0, Math.round((s.end.getTime() - rec.outAt)/60000));
    const ot = Math.max(0, Math.round((rec.outAt - s.end.getTime())/60000));
    rec.otMin = ot >= Number(db.settings.minOvertime||0) ? ot : 0;
  } else { rec.earlyMin = 0; rec.otMin = 0; }
  return rec;
}
function recalcAll(){ db.records.forEach(recalc); }
function openRecord(empId){
  const cutoff = Date.now() - 26*3600*1000;
  return db.records.filter(r => r.empId===empId && !r.outAt && r.inAt > cutoff)
                   .sort((a,b)=>b.inAt-a.inAt)[0] || null;
}
function todayRecords(empId){ const k = dkey(); return db.records.filter(r => r.empId===empId && r.date===k); }
function empState(emp){
  const open = openRecord(emp.id);
  if(open){
    const stale = Date.now() - open.inAt > 16*3600*1000;
    return { key: stale ? "alert" : "kerja", rec: open, stale };
  }
  const done = todayRecords(emp.id).filter(r=>r.outAt).sort((a,b)=>b.outAt-a.outAt)[0];
  if(done) return { key:"selesai", rec:done };
  return { key:"belum", rec:null };
}
function worksOn(emp, dateKey){ return !!shiftOn(emp, dateKey); }

/* ============================================================
   LOKASI — geotagging & geofencing
   Koordinat diambil saat absen dan disimpan di HP ini saja.
   ============================================================ */
function geoAktif(){
  const s = db.settings;
  return s.geoMode !== "off" && s.geoLat !== null && s.geoLat !== undefined
      && s.geoLon !== null && s.geoLon !== undefined;
}
function getPosition(timeout){
  return new Promise(res => {
    if(!navigator.geolocation || !window.isSecureContext) return res({ error:"unsupported" });
    navigator.geolocation.getCurrentPosition(
      p => res({ lat:p.coords.latitude, lon:p.coords.longitude, acc:Math.round(p.coords.accuracy) }),
      e => res({ error: e.code === 1 ? "denied" : e.code === 2 ? "unavailable" : "timeout" }),
      { enableHighAccuracy:true, timeout: timeout || 15000, maximumAge:10000 }
    );
  });
}
/* jarak lingkaran besar (haversine), dalam meter */
function distM(lat1, lon1, lat2, lon2){
  const R = 6371000, rad = Math.PI/180;
  const dLat = (lat2-lat1)*rad, dLon = (lon2-lon1)*rad;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}
function jarakKeCafe(pos){
  if(!pos || pos.error || !geoAktif()) return null;
  return Math.round(distM(pos.lat, pos.lon, Number(db.settings.geoLat), Number(db.settings.geoLon)));
}
function fmtJarak(m){
  if(m === null || m === undefined) return "—";
  return m < 1000 ? `${m} m` : `${(m/1000).toFixed(2).replace(".",",")} km`;
}
const geoErrText = {
  denied:"Izin lokasi ditolak", unavailable:"Sinyal GPS tidak tersedia",
  timeout:"Pencarian lokasi kehabisan waktu", unsupported:"Perangkat tidak mendukung lokasi"
};
/* Hasil pemeriksaan geofence untuk satu posisi. */
function cekGeo(pos){
  if(!geoAktif()) return { status:"off" };
  if(!pos || pos.error) return { status:"gagal", pesan: geoErrText[pos ? pos.error : "unavailable"] };
  const jarak = jarakKeCafe(pos);
  const radius = Number(db.settings.geoRadius) || 0;
  return { status: jarak <= radius ? "dalam" : "luar", jarak, radius, acc:pos.acc };
}
function mapsLink(lat, lon){ return `https://www.google.com/maps?q=${lat},${lon}`; }

/* ============================================================
   MESIN PENCOCOKAN WAJAH
   Deskriptor: HOG 6x6 sel x 8 arah (288 dim) + peta intensitas
   12x12 (144 dim), keduanya dinormalisasi L2. Kemiripan = dot
   product (kosinus). Berjalan sepenuhnya offline di HP.
   ============================================================ */
const FACE_BASE = 0.62;            // dasar kemiripan HOG antar-wajah apa pun
const toPct = dot => Math.round(Math.max(0, Math.min(1, (dot - FACE_BASE)/(1 - FACE_BASE))) * 100);

/* Deskriptor HOG tidak kebal terhadap skala: wajah yang sama, difoto dari
   jarak berbeda, menghasilkan pola gradien yang berbeda. Karena itu jarak
   berdiri saat absen harus mirip dengan saat pendaftaran. Nilai berikut
   dinaikkan bila cara mengukur bingkai berubah, agar wajah lama yang tidak
   sebanding tidak dipakai membandingkan dan diminta daftar ulang. */
const TPL_VER = 2;
function templatesOf(emp){
  if(!emp || !emp.templates || !emp.templates.length) return null;
  if((emp.tplVer || 1) !== TPL_VER) return null;      // dari versi lama, tidak sebanding
  return emp.templates;
}
function perluDaftarUlang(emp){
  return !!(emp && emp.templates && emp.templates.length && (emp.tplVer || 1) !== TPL_VER);
}

/* Alih-alih memaksa karyawan berdiri persis sejauh saat mendaftar, pencocokan
   dibuat kebal skala: saat absen, wajah dibandingkan pada beberapa perbesaran
   dan pergeseran tegak, lalu diambil yang paling cocok. Perbesaran pemenang
   sekaligus memberi tahu apakah orangnya berdiri lebih jauh atau lebih dekat
   daripada saat mendaftar — sinyal yang jauh lebih andal daripada menebak
   warna kulit, yang mudah tertipu latar kayu dan dinding hangat. */
/* Tujuh perbesaran, tanpa geseran tegak. Pengukuran menunjukkan geseran tegak
   tidak menambah akurasi sama sekali — oval panduan sudah cukup menyamakan
   posisi — tapi melipatgandakan biaya sekaligus memperbesar peluang orang lain
   ikut lolos, karena skor diambil dari kandidat terbaik. */
const SKALA = [0.45, 0.55, 0.7, 0.85, 1.0, 1.2, 1.45];
function kotakVarian(box, skala, W, H){
  return clampBox(box.x + box.w/2, box.y + box.h/2, box.w*skala, W, H);
}
/* Kumpulan deskriptor satu tangkapan pada berbagai perbesaran. Potongan yang
   lebih kecil berarti memperbesar wajah, yaitu mengimbangi orang yang berdiri
   lebih jauh. */
function piramida(canvas, box){
  return SKALA.map(s => ({ s,
    vec: descriptor(canvas, kotakVarian(box, s, canvas.width, canvas.height)).vec }));
}

let detector = null, detectorReady = false;
function getDetector(){
  if(detectorReady) return detector;
  detectorReady = true;
  try{ if("FaceDetector" in window) detector = new window.FaceDetector({fastMode:true, maxDetectedFaces:1}); }
  catch(e){ detector = null; }
  return detector;
}
const FALLBACK_BOX = { cx:0.5, cy:0.45, side:0.62 };   // sepadan dengan oval panduan

async function detectBox(canvas){
  const d = getDetector();
  const W = canvas.width, H = canvas.height;
  if(d){
    try{
      const faces = await d.detect(canvas);
      if(faces && faces.length){
        const b = faces[0].boundingBox;
        const side = Math.max(b.width, b.height) * 1.16;
        const cx = b.x + b.width/2, cy = b.y + b.height/2;
        return { box: clampBox(cx, cy, side, W, H), detected:true };
      }
      return { box: clampBox(FALLBACK_BOX.cx*W, FALLBACK_BOX.cy*H, FALLBACK_BOX.side*W, W, H), detected:false };
    }catch(e){ detector = null; }
  }
  return { box: clampBox(FALLBACK_BOX.cx*W, FALLBACK_BOX.cy*H, FALLBACK_BOX.side*W, W, H), detected:null };
}
function clampBox(cx, cy, side, W, H){
  side = Math.min(side, Math.min(W,H));
  let x = cx - side/2, y = cy - side/2;
  x = Math.max(0, Math.min(W - side, x));
  y = Math.max(0, Math.min(H - side, y));
  return { x, y, w:side, h:side };
}

function descriptor(src, box){
  const S = 48, c = document.createElement("canvas");
  c.width = S; c.height = S;
  const ctx = c.getContext("2d", { willReadFrequently:true });
  ctx.drawImage(src, box.x, box.y, box.w, box.h, 0, 0, S, S);
  const px = ctx.getImageData(0,0,S,S).data;
  const g = new Float32Array(S*S);
  for(let i=0,p=0; i<g.length; i++, p+=4) g[i] = (0.299*px[p] + 0.587*px[p+1] + 0.114*px[p+2]) / 255;

  let mean = 0; for(let i=0;i<g.length;i++) mean += g[i]; mean /= g.length;
  const brightness = mean;
  let sd = 0; for(let i=0;i<g.length;i++) sd += (g[i]-mean)**2; sd = Math.sqrt(sd/g.length) + 1e-6;
  for(let i=0;i<g.length;i++) g[i] = (g[i]-mean)/sd;

  const CELL = 8, NC = S/CELL, BINS = 8;
  const hog = new Float32Array(NC*NC*BINS);
  for(let y=1;y<S-1;y++) for(let x=1;x<S-1;x++){
    const gx = g[y*S+x+1] - g[y*S+x-1];
    const gy = g[(y+1)*S+x] - g[(y-1)*S+x];
    const mag = Math.hypot(gx,gy);
    if(mag < 1e-4) continue;
    let a = Math.atan2(gy,gx); if(a < 0) a += Math.PI;
    let b = Math.floor(a/Math.PI*BINS); if(b >= BINS) b = BINS-1;
    hog[((y/CELL|0)*NC + (x/CELL|0))*BINS + b] += mag;
  }
  for(let i=0;i<NC*NC;i++){
    let s = 0; for(let b=0;b<BINS;b++) s += hog[i*BINS+b]**2;
    s = Math.sqrt(s) + 1e-6;
    for(let b=0;b<BINS;b++) hog[i*BINS+b] /= s;
  }
  const P = 12, POOL = S/P, inten = new Float32Array(P*P);
  for(let py=0;py<P;py++) for(let pxx=0;pxx<P;pxx++){
    let s = 0;
    for(let j=0;j<POOL;j++) for(let i=0;i<POOL;i++) s += g[(py*POOL+j)*S + pxx*POOL + i];
    inten[py*P+pxx] = s/(POOL*POOL);
  }
  let nh = 0; for(let i=0;i<hog.length;i++) nh += hog[i]**2; nh = Math.sqrt(nh)+1e-6;
  let ni = 0; for(let i=0;i<inten.length;i++) ni += inten[i]**2; ni = Math.sqrt(ni)+1e-6;
  const W_INT = 0.55;
  const out = new Float32Array(hog.length + inten.length);
  for(let i=0;i<hog.length;i++) out[i] = hog[i]/nh;
  for(let i=0;i<inten.length;i++) out[hog.length+i] = W_INT * inten[i]/ni;
  let nf = 0; for(let i=0;i<out.length;i++) nf += out[i]**2; nf = Math.sqrt(nf)+1e-6;

  const vec = new Array(out.length);
  for(let i=0;i<out.length;i++) vec[i] = Math.round(out[i]/nf*10000)/10000;
  return { vec, brightness };
}
function cosine(a,b){
  if(!a || !b || a.length !== b.length) return 0;
  let s = 0; for(let i=0;i<a.length;i++) s += a[i]*b[i];
  return s;
}
/* Cari kecocokan terbaik di seluruh piramida. Mengembalikan skor sekaligus
   skala pemenang, supaya bisa dijelaskan kalau orangnya berdiri terlalu jauh. */
function cocokTerbaik(vecs, emp){
  const tpl = templatesOf(emp);
  if(!tpl) return null;
  let best = -1, skala = 1;
  for(const v of vecs) for(const t of tpl){
    const d = cosine(v.vec, t);
    if(d > best){ best = d; skala = v.s; }
  }
  return { skor: toPct(best), skala };
}
function matchScore(vecs, emp){
  const r = cocokTerbaik(vecs, emp);
  return r ? r.skor : null;
}

  const d = document.createElement("div");

function pinKey(k){
  if(k === "cancel"){ closePin(); const r = pinResolve; pinResolve = null; if(r) r(null); return; }
  if(k === "del"){ pinBuf = pinBuf.slice(0,-1); }
  else if(pinBuf.length < 4){ pinBuf += k; }
  const dots = el("pindots");
  if(dots) [...dots.children].forEach((d,i)=>d.classList.toggle("on", i < pinBuf.length));
  if(pinBuf.length === 4){
    const val = pinBuf;
    setTimeout(()=>{ closePin(); const r = pinResolve; pinResolve = null; if(r) r(val); }, 140);
  }
}

/* ============================================================
   KAMERA
   ============================================================ */
let cam = null;
const CAM_SIZE = 640;      // makin besar, makin banyak detail wajah untuk deskriptor
const FOTO_SIZE = 360;     // foto bukti yang disimpan
const FOTO_Q = 0.72;

async function openCam(opts){
  // opts: {mode:'absen'|'enroll'|'test', empId, action:'masuk'|'pulang'}
  cam = Object.assign({ shots:[], step:0, stream:null, timer:null, hits:0, counting:false, adminOK:false }, opts);
  const emp = db.employees.find(e => e.id === opts.empId);
  const title = opts.mode === "test" ? "Uji Kecocokan Wajah" : (emp ? emp.name : "Kamera");
  const subtitle = opts.mode === "enroll" ? "Daftarkan wajah"
                 : opts.mode === "test" ? "Bandingkan dengan semua karyawan"
                 : (opts.action === "masuk" ? "Absen masuk" : "Absen pulang");

  el("layer").innerHTML = `
  <div class="cam" role="dialog" aria-modal="true">
    <div class="chead">
      <div class="t"><div class="n">${esc(title)}</div><div class="a">${esc(subtitle)}</div></div>
      <button class="xbtn" data-act="camclose" aria-label="Tutup kamera">&times;</button>
    </div>
    <div class="stage" id="stage">
      <video id="vid" playsinline autoplay muted></video>
      <div class="oval" id="oval"></div>
      <div id="fx"></div>
    </div>
    <div class="cstat" id="cstat">Menyiapkan kamera…</div>
    ${opts.mode === "absen" && geoAktif() ? `<div class="geobar" id="geobar">
      <span class="dot cari"></span><span id="geotxt">Mencari lokasi…</span></div>` : ""}
    <div class="cbody" id="cbody"></div>
  </div>`;

  if(opts.mode === "absen" && geoAktif() && !cam.pos) mulaiLacakLokasi();

  const cbody = el("cbody");
  try{
    cam.stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:1280} }, audio:false });
    const v = el("vid");
    v.srcObject = cam.stream;
    await v.play().catch(()=>{});
    cstat(getDetector() ? "Posisikan wajah di dalam oval" : "Posisikan wajah di dalam oval, lalu tekan Ambil Foto");
    cbody.innerHTML = `<div class="btnrow"><button class="btn pri blk" data-act="shoot">Ambil Foto</button></div>
      ${opts.mode === "enroll" ? shotsHTML() : ""}`;
    // panduan jarak tetap jalan walau perangkat tidak punya FaceDetector
    cam.timer = setInterval(tick, 350);
  }catch(e){
    cam.noStream = true;
    el("stage").innerHTML = `<div style="position:absolute;inset:0;display:grid;place-items:center;
      color:#9AA697;font-family:var(--f-mono);font-size:12px;text-align:center;padding:24px">
      Kamera langsung tidak tersedia.<br>Gunakan kamera bawaan HP.</div>`;
    cstat("Tekan tombol di bawah untuk membuka kamera HP");
    cbody.innerHTML = `
      <label class="btn pri blk" style="cursor:pointer">Buka Kamera HP
        <input type="file" accept="image/*" capture="user" id="filecap" hidden></label>
      ${opts.mode === "enroll" ? shotsHTML() : ""}`;
    el("filecap").addEventListener("change", onFilePick);
  }
}
/* Lokasi dicari berbarengan dengan kamera menyala agar sudah dapat sinyal
   saat foto diambil. Hasilnya disimpan di cam.pos. */
async function mulaiLacakLokasi(){
  const c = cam;
  const pos = await getPosition(15000);
  if(!cam || cam !== c) return;          // kamera sudah ditutup atau diganti
  cam.pos = pos;
  tampilGeobar();
}
function tampilGeobar(){
  const bar = el("geobar"), txt = el("geotxt");
  if(!bar || !txt) return;
  const g = cekGeo(cam && cam.pos);
  const dot = bar.querySelector(".dot");
  if(!cam || !cam.pos){ txt.textContent = "Mencari lokasi…"; dot.className = "dot cari"; return; }
  if(g.status === "gagal"){ txt.textContent = g.pesan; dot.className = "dot luar"; return; }
  dot.className = "dot " + (g.status === "dalam" ? "dalam" : "luar");
  txt.innerHTML = g.status === "dalam"
    ? `Dalam area cafe · <b>${fmtJarak(g.jarak)}</b> <span class="acc">±${g.acc} m</span>`
    : `Di luar area · <b>${fmtJarak(g.jarak)}</b> dari cafe (radius ${g.radius} m) <span class="acc">±${g.acc} m</span>`;
}
function shotsHTML(){
  return `<div class="shots">${[0,1,2].map(i=>{
    const s = cam.shots[i];
    return `<div>${s ? `<img src="${s.photo}" alt="">` : (i+1)}</div>`;
  }).join("")}</div>
  <div class="cstat" style="min-height:0;padding-top:2px">Ambil 3 foto: lurus, sedikit ke kiri, sedikit ke kanan</div>`;
}
function cstat(html){ const s = el("cstat"); if(s) s.innerHTML = html; }

function closeCam(){
  if(cam){
    clearInterval(cam.timer);
    if(cam.stream) cam.stream.getTracks().forEach(t=>t.stop());
  }
  cam = null;
  el("layer").innerHTML = "";
}

function grabFrame(){
  const c = document.createElement("canvas");
  c.width = CAM_SIZE; c.height = CAM_SIZE;
  const ctx = c.getContext("2d", { willReadFrequently:true });
  const v = el("vid");
  if(v && v.videoWidth){
    const s = Math.min(v.videoWidth, v.videoHeight);
    ctx.drawImage(v, (v.videoWidth-s)/2, (v.videoHeight-s)/2, s, s, 0, 0, CAM_SIZE, CAM_SIZE);
  }
  return c;
}

async function tick(){
  if(!cam || cam.counting || cam.frozen) return;
  const c = grabFrame();
  const r = await detectBox(c);
  const oval = el("oval");
  if(!oval) return;

  if(r.detected){
    cam.hits++;
    oval.classList.add("lock");
    cstat(cam.hits < 3 ? "<b>Wajah terdeteksi</b> — tahan posisi…" : "<b>Siap</b>");
    if(cam.hits >= 3){ cam.counting = true; countdown(3); }
  }else{
    cam.hits = 0; oval.classList.remove("lock");
    // tanpa FaceDetector tidak ada yang bisa diukur andal dari satu bingkai,
    // jadi cukup arahkan posisinya dan biarkan tombol Ambil Foto yang dipakai
    cstat(r.detected === false ? "Posisikan wajah di dalam oval"
                               : "Isi oval dengan wajah, lalu tekan Ambil Foto");
  }
}
function countdown(n){
  if(!cam) return;
  const fx = el("fx"); if(!fx) return;
  if(n === 0){ fx.innerHTML = ""; capture(grabFrame()); return; }
  fx.innerHTML = `<div class="count">${n}</div>`;
  setTimeout(()=>countdown(n-1), 700);
}
function manualShoot(){
  if(!cam || cam.frozen) return;
  cam.counting = true;
  capture(grabFrame());
}
function onFilePick(e){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = CAM_SIZE; c.height = CAM_SIZE;
    const ctx = c.getContext("2d", { willReadFrequently:true });
    const s = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, CAM_SIZE, CAM_SIZE);
    capture(c, true);
    URL.revokeObjectURL(img.src);
  };
  img.onerror = () => toast("Foto tidak bisa dibaca");
  img.src = URL.createObjectURL(f);
}

async function capture(canvas, fromFile){
  if(!cam) return;
  cam.frozen = true;
  clearInterval(cam.timer);
  const fx = el("fx"); if(fx && !fromFile) fx.innerHTML = `<div class="flash"></div>`;

  const r = await detectBox(canvas);
  const d = descriptor(canvas, r.box);
  // pendaftaran memakai deskriptor dasar; absen dibandingkan lintas skala
  const vecs = cam.mode === "enroll" ? null : piramida(canvas, r.box);
  const photo = shrink(canvas, FOTO_SIZE, FOTO_Q);

  // pratinjau memakai tangkapan resolusi penuh, bukan foto simpanan yang
  // diperkecil, supaya tidak terlihat kabur saat direntang di layar tablet
  const stage = el("stage");
  stage.innerHTML = `<img class="shot" src="${canvas.toDataURL("image/jpeg", 0.92)}" alt="Foto absen">`;

  if(d.brightness < 0.2){
    cstat("<b>Foto terlalu gelap</b> — nyalakan lampu, lalu ulangi");
  }else if(r.detected === false){
    cstat("Wajah tidak terdeteksi — memakai area oval");
  }else{
    cstat(r.detected === null ? "Foto diambil" : "<b>Wajah terdeteksi</b>");
  }

  cam.last = { vec:d.vec, vecs, photo, brightness:d.brightness, detected:r.detected };

  if(cam.mode === "enroll")      renderEnroll();
  else if(cam.mode === "test")   renderTest();
  else                           renderVerify();
}
function shrink(canvas, size, q){
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  c.getContext("2d").drawImage(canvas, 0, 0, size, size);
  return c.toDataURL("image/jpeg", q);
}
function retake(){
  const opts = { mode:cam.mode, empId:cam.empId, action:cam.action,
                 shots:cam.shots, adminOK:cam.adminOK, pos:cam.pos, pinBy:cam.pinBy };
  closeCam();
  openCam(opts).then(() => { if(cam) tampilGeobar(); });
}

function renderEnroll(){
  el("cbody").innerHTML = `
    ${shotsHTML()}
    <div class="btnrow" style="margin-top:6px">
      <button class="btn" data-act="retake">Ulangi</button>
      <button class="btn ok" data-act="keepshot">Pakai Foto ${cam.shots.length+1}</button>
    </div>`;
}
function keepShot(){
  cam.shots.push(cam.last);
  if(cam.shots.length >= 3){
    const emp = db.employees.find(e => e.id === cam.empId);
    if(emp){
      emp.templates = cam.shots.map(s => s.vec);
      emp.tplVer = TPL_VER;
      emp.avatar = cam.shots[0].photo;
      save();
    }
    const name = emp ? emp.name : "";
    closeCam();
    toast(`Wajah ${name} berhasil didaftarkan`);
    render();
    if(activeTab === "admin") openEmpForm(cam0EmpId);
  }else{
    retake();
  }
}
let cam0EmpId = null;

function renderTest(){
  const scored = db.employees.filter(e => templatesOf(e))
    .map(e => ({ e, c: cocokTerbaik(cam.last.vecs, e) }))
    .map(x => ({ e:x.e, s:x.c.skor, skala:x.c.skala }))
    .sort((a,b) => b.s - a.s);
  const th = Number(db.settings.faceThreshold);
  const perlu = db.employees.filter(perluDaftarUlang).length;
  el("cbody").innerHTML = `
    <div class="cstat" style="padding:4px 0 10px">Ambang saat ini: <b>${th}%</b></div>
    ${perlu ? `<div class="cstat" style="padding:0 0 10px">${perlu} karyawan belum didaftarkan
      ulang dengan pengukuran baru, jadi tidak ikut dibandingkan.</div>` : ""}
    ${scored.length ? `<ul class="rank">${scored.map(x =>
      `<li><span>${esc(x.e.name)}</span>
        <span class="accnote" style="margin:0 8px 0 auto">${
          x.skala <= 0.7 ? "lebih jauh" : x.skala >= 1.2 ? "lebih dekat" : "jarak pas"}</span>
        <b style="margin:0;color:${x.s>=th?"#3FC486":"#9AA697"}">${x.s}%</b></li>`).join("")}</ul>`
      : `<div class="cstat">Belum ada karyawan dengan wajah terdaftar.</div>`}
    <div class="btnrow" style="margin-top:14px">
      <button class="btn" data-act="retake">Ulangi</button>
      <button class="btn pri" data-act="camclose">Selesai</button>
    </div>`;
}

/* Kecocokan rendah hampir selalu punya sebab yang bisa diperbaiki di tempat.
   Skala pemenang dari piramida memberi tahu jarak berdiri secara terukur:
   kalau yang paling cocok adalah potongan yang diperbesar, berarti wajahnya
   tampil lebih kecil daripada saat mendaftar — orangnya berdiri terlalu jauh. */
function sebabTidakCocok(emp, last, cocok){
  const petunjuk = [];
  if(last.brightness < 0.3) petunjuk.push("cahaya kurang");
  if(cocok){
    // potongan kecil menang berarti wajah harus diperbesar dulu: orangnya jauh
    if(cocok.skala <= 0.7) petunjuk.push("<b>berdiri lebih jauh</b> daripada saat mendaftar — coba maju");
    else if(cocok.skala >= 1.2) petunjuk.push("<b>berdiri lebih dekat</b> daripada saat mendaftar — coba mundur");
  }
  if(last.detected === false) petunjuk.push("wajah tidak terdeteksi di dalam oval");
  if(!petunjuk.length) petunjuk.push("penampilan berubah, atau memang orang lain");
  return `<div class="accnote" style="margin-top:9px;line-height:1.5">
    Kemungkinan sebab: ${petunjuk.join(" · ")}</div>`;
}

function renderVerify(){
  const emp = db.employees.find(e => e.id === cam.empId);
  const mode = db.settings.faceMode;
  const th = Number(db.settings.faceThreshold);
  const cocok = mode === "off" ? null : cocokTerbaik(cam.last.vecs, emp);
  const score = cocok ? cocok.skor : null;
  cam.score = score;
  const pass = score === null ? true : score >= th;

  let block = "";
  if(cam.pinBy === "pin"){
    block += `<div class="score pass" style="padding:6px 0 10px">
      <div class="pct sm">PIN benar</div><div class="vd">Identitas terverifikasi</div></div>`;
  }else if(cam.pinBy === "admin"){
    block += `<div class="score fail" style="padding:6px 0 10px">
      <div class="pct sm">Izin admin</div><div class="vd">PIN karyawan tidak cocok</div></div>`;
  }else if(cam.pinBy === "kosong"){
    block += `<div class="cstat" style="padding:8px 0">PIN karyawan ini belum diatur —
      absen ditandai untuk dicek admin.</div>`;
  }
  if(score === null){
    block += `<div class="cstat" style="padding:10px 0">${
      mode === "off" ? "Foto selfie disimpan sebagai bukti."
      : perluDaftarUlang(emp) ? "Wajah perlu didaftarkan ulang dengan cara pengukuran yang baru — foto tetap disimpan sebagai bukti."
      : "Wajah belum didaftarkan untuk karyawan ini — foto tetap disimpan sebagai bukti."}</div>`;
  }else{
    block = `<div class="score ${pass?"pass":"fail"}">
      <div class="pct">${score}%</div>
      <div class="vd">${pass ? "Wajah cocok" : "Wajah tidak cocok"}</div>
      ${!pass ? sebabTidakCocok(emp, cam.last, cocok) : ""}</div>`;
  }

  // --- lokasi ---
  const g = cekGeo(cam.pos);
  cam.geo = g;
  const geoStrict = db.settings.geoMode === "strict";
  const geoOK = g.status === "off" || g.status === "dalam";
  if(g.status !== "off"){
    const kelas = geoOK ? "pass" : "fail";
    const isi = g.status === "gagal"
      ? `<div class="pct sm">GPS</div><div class="vd">${esc(g.pesan)}</div>`
      : `<div class="pct sm">${fmtJarak(g.jarak)}</div>
         <div class="vd">${geoOK ? "Di dalam area cafe" : `Di luar area · radius ${g.radius} m`}</div>
         <div class="accnote">akurasi ±${g.acc} m</div>`;
    block += `<div class="score ${kelas}" style="padding-top:0">${isi}</div>`;
  }

  let actions;
  const faceBlocked = !pass && mode === "strict";
  const geoBlocked  = !geoOK && geoStrict;
  const blocked = (faceBlocked || geoBlocked) && !cam.adminOK;

  if(blocked){
    const sebab = [];
    if(faceBlocked) sebab.push(`kecocokan wajah di bawah ambang <b>${th}%</b>`);
    if(geoBlocked) sebab.push(g.status === "gagal"
      ? `lokasi tidak terbaca (${esc(g.pesan.toLowerCase())})`
      : `posisi <b>${fmtJarak(g.jarak)}</b> dari cafe, di luar radius ${g.radius} m`);
    actions = `<div class="cstat" style="padding:2px 0 12px">Absen ditahan karena ${sebab.join(" dan ")}.
        ${geoBlocked ? "Pastikan GPS menyala dan Anda berada di cafe. " : "Coba lagi dengan pencahayaan lebih baik. "}
        Atau minta izin admin.</div>
      <div class="btnrow">
        <button class="btn" data-act="retake">Ulangi</button>
        <button class="btn pri" data-act="override">Izin Admin</button>
      </div>`;
  }else{
    if(!pass) block += `<div class="cstat" style="padding:0 0 10px">Wajah di bawah ambang ${th}% — absen tetap
      dicatat dan ditandai untuk dicek admin.</div>`;
    if(!geoOK && g.status !== "off") block += `<div class="cstat" style="padding:0 0 10px">Lokasi di luar area —
      absen tetap dicatat dan ditandai untuk dicek admin.</div>`;
    if(cam.adminOK) block += `<div class="cstat" style="padding:0 0 10px">Disetujui admin.</div>`;
    actions = `<div class="btnrow">
        <button class="btn" data-act="retake">Ulangi</button>
        <button class="btn ok" data-act="saveabsen">Simpan Absen ${cam.action === "masuk" ? "Masuk" : "Pulang"}</button>
      </div>`;
  }
  el("cbody").innerHTML = block + actions;
}

async function overrideAdmin(){
  const pin = await askPin("Izin Admin", "Setujui absen meski verifikasi tidak lolos");
  if(pin === null){ renderVerify(); return; }
  if(pin !== String(db.settings.pin)){ toast("PIN salah"); renderVerify(); return; }
  cam.adminOK = true;
  renderVerify();
}

async function saveAbsen(){
  const emp = db.employees.find(e => e.id === cam.empId);
  if(!emp){ closeCam(); return; }
  const now = Date.now();
  const flagged = cam.score !== null && cam.score < Number(db.settings.faceThreshold);
  // geotag: koordinat mentah selalu disimpan bila terbaca, meski geofence mati
  const p = cam.pos && !cam.pos.error ? cam.pos : null;
  const g = cam.geo || cekGeo(cam.pos);
  const geoFlag = g.status === "luar" || g.status === "gagal";
  const tag = pre => ({
    [pre+"Lat"]: p ? +p.lat.toFixed(6) : null,
    [pre+"Lon"]: p ? +p.lon.toFixed(6) : null,
    [pre+"Acc"]: p ? p.acc : null,
    [pre+"Dist"]: g.status === "dalam" || g.status === "luar" ? g.jarak : null,
    [pre+"GeoFlag"]: g.status === "off" ? false : geoFlag,
    [pre+"PinBy"]: cam.pinBy || "off",
    [pre+"PinFlag"]: cam.pinBy === "kosong" || cam.pinBy === "admin"
  });

  if(cam.action === "masuk"){
    const rec = Object.assign({ id:uid(), empId:emp.id, date:dkey(), inAt:now, outAt:null,
      inScore:cam.score, outScore:null, inFlag:flagged, outFlag:false,
      inAdmin:!!cam.adminOK, outAdmin:false, note:"", edited:false, hasIn:true, hasOut:false },
      tag("in"));
    recalc(rec);
    db.records.push(rec);
    await photoSet(rec.id + ":in", cam.last.photo);
    save();
    const denda = fineFor(rec.lateMin);
    const msg = rec.lateMin > 0
      ? `Masuk ${hm(now)} — terlambat ${fmtDur(rec.lateMin)}${denda ? ` · denda ${rupiah(denda)}` : ""}`
      : `Masuk ${hm(now)} — tepat waktu`;
    closeCam(); render(); toast(`${emp.name}: ${msg}`);
  }else{
    const rec = openRecord(emp.id);
    if(!rec){ closeCam(); toast("Tidak ada absen masuk yang terbuka"); return; }
    rec.outAt = now; rec.outScore = cam.score; rec.outFlag = flagged; rec.outAdmin = !!cam.adminOK; rec.hasOut = true;
    Object.assign(rec, tag("out"));
    recalc(rec);
    await photoSet(rec.id + ":out", cam.last.photo);
    save();
    let msg = `Pulang ${hm(now)} — kerja ${fmtDur(rec.workMin)}`;
    if(rec.otMin > 0) msg += `, lembur ${fmtDur(rec.otMin)}`;
    closeCam(); render(); toast(`${emp.name}: ${msg}`);
  }
}

/* ============================================================
   JADWAL — roster mingguan, satu shift per karyawan per tanggal
   ============================================================ */
let weekStart = mondayOf(new Date());

function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const shift = (x.getDay() + 6) % 7;          // Senin = awal minggu
  x.setDate(x.getDate() - shift);
  return x;
}
function weekDates(start){
  return Array.from({length:7}, (_,i) => {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    return dkey(d);
  });
}
function weekLabel(start){
  const ds = weekDates(start);
  const [ay,am,ad] = ds[0].split("-").map(Number);
  const [by,bm,bd] = ds[6].split("-").map(Number);
  if(am === bm) return `${ad}–${bd} ${MONTHS[am-1]} ${ay}`;
  if(ay === by) return `${ad} ${MONTHS[am-1]} – ${bd} ${MONTHS[bm-1]} ${ay}`;
  return `${ad} ${MONTHS[am-1]} ${ay} – ${bd} ${MONTHS[bm-1]} ${by}`;
}
function secJadwal(){
  const emps = sortedEmps(db.employees.filter(e => e.active !== false));
  const ds = weekDates(weekStart);
  const today = dkey();
  // hanya hitung yang benar-benar tampil terisi: shift yang masih ada, atau libur
  const terisi = ds.reduce((a,k) => a + emps.filter(e => {
    const v = rosterRaw(k, e.id);
    return v === "off" || (!!v && !!shiftById(v));
  }).length, 0);
  const total = ds.length * emps.length;

  if(!emps.length){
    return `<div class="card"><div class="empty">
      <div class="big">Belum ada karyawan</div>
      Tambahkan karyawan lebih dulu di tab <b>Orang</b>, baru jadwal shiftnya bisa disusun di sini.
    </div></div>`;
  }
  return `
  <div class="wknav">
    <button class="btn sm ghost" data-act="week" data-d="-1" aria-label="Minggu sebelumnya">‹</button>
    <div class="wklbl"><b>${esc(weekLabel(weekStart))}</b>
      <span>${terisi} dari ${total} sel terisi</span></div>
    <button class="btn sm ghost" data-act="week" data-d="1" aria-label="Minggu berikutnya">›</button>
  </div>
  <div class="btnrow" style="margin-bottom:12px">
    <button class="btn sm" data-act="week" data-d="0">Minggu Ini</button>
    <button class="btn sm" data-act="copyweek">Salin Minggu Lalu</button>
  </div>

  <div class="twrap"><table class="roster">
    <thead><tr><th data-act="sortname" title="Ubah urutan nama">Karyawan ${sortArrow()}</th>${ds.map(k => {
      const [,,dd] = k.split("-");
      const [y,m,d] = k.split("-").map(Number);
      return `<th class="dayhead ${k === today ? "kini" : ""}" data-act="fillday" data-k="${k}"
        title="Atur semua karyawan pada hari ini">${DAYS[new Date(y,m-1,d).getDay()]}<br><span>${dd}</span></th>`;
    }).join("")}</tr></thead>
    <tbody>${emps.map(e => `
      <tr>
        <td data-act="fillrow" data-id="${e.id}" title="Atur satu shift untuk seminggu">
          ${esc(e.name)}<span class="rowhint">seminggu</span></td>
        ${ds.map(k => {
          const v = rosterRaw(k, e.id);
          const sh = (v && v !== "off") ? shiftById(v) : null;
          const cls = sh ? "ada" : v === "off" ? "off" : "kosong";
          const teks = sh ? esc(sh.code) : v === "off" ? "L" : "–";
          return `<td class="cell ${cls} ${k === today ? "kini" : ""}"
            data-act="cell" data-k="${k}" data-id="${e.id}"
            aria-label="${esc(e.name)} ${shortDate(k)}: ${sh ? esc(sh.name) : v === "off" ? "libur" : "belum dijadwalkan"}"
            >${teks}</td>`;
        }).join("")}
      </tr>`).join("")}</tbody>

/* ---- rekap ---- */
function periodRange(){
  if(period === "today"){ const k = dkey(); return { from:k, to:k, label:longDate(k) }; }
  const [y,m] = period.split("-").map(Number);
  const last = new Date(y, m, 0).getDate();
  return { from:`${y}-${pad(m)}-01`, to:`${y}-${pad(m)}-${pad(last)}`, label:`${MONTHS[m-1]} ${y}` };
}
function summarize(){
  const { from, to } = periodRange();
  const today = dkey();
  return sortedEmps().map(e => {
    const rs = db.records.filter(r => r.empId === e.id && r.date >= from && r.date <= to);
    const hadirDays = new Set(rs.map(r => r.date));
    let sched = 0;
    const belumHadir = [];
    const [fy,fm,fd] = from.split("-").map(Number);
    const [ty,tm,td] = to.split("-").map(Number);
    for(let d = new Date(fy,fm-1,fd); d <= new Date(ty,tm-1,td); d.setDate(d.getDate()+1)){
      const k = dkey(d);
      if(k > today) break;
      if(worksOn(e,k)){ sched++; if(!hadirDays.has(k)) belumHadir.push(k); }
    }
    const lateCnt = rs.filter(r => r.lateMin > 0).length;
    const sum = (f) => rs.reduce((a,r) => a + (r[f]||0), 0);
    const alpa = belumHadir.length;   // hari berjadwal yang sudah lewat tanpa catatan absen
    const fine = rs.reduce((a,r) => a + fineFor(r.lateMin), 0);
    return { e, recs:rs, hadir:hadirDays.size, sched, alpa, lateCnt, fine,
             lateMin:sum("lateMin"), workMin:sum("workMin"), otMin:sum("otMin"), earlyMin:sum("earlyMin") };
  });
}

  <div class="sect"><h2>${esc(label)}</h2><span class="lbl">Ketuk baris untuk rincian</span></div>
  ${db.employees.length ? `
  <div class="twrap"><table>
    <thead><tr><th data-act="sortname" title="Ubah urutan nama">Karyawan ${sortArrow()}</th><th>Hadir</th><th>Alpa</th><th>Telat</th><th>Telat&nbsp;(m)</th>${

    <tbody>${rows.map(r => `

    ${db.settings.fineEnabled && rows.some(r => r.fine) ? `<tfoot><tr>

async function loadRecPhotos(r){
  const box = el("recphotos"); if(!box) return;
  const [pi, po] = await Promise.all([photoGet(r.id + ":in"), photoGet(r.id + ":out")]);
  const cell = (p, cap, score, lat, lon, dist, flag) => {
    if(!p && lat == null) return "";
    const lok = lat != null
      ? `<a class="geolink ${flag ? "bad" : ""}" href="${mapsLink(lat,lon)}" target="_blank" rel="noopener"
           >${dist != null ? fmtJarak(dist) + " dari cafe" : "lihat lokasi"} ↗</a>`
      : `<span class="geolink none">tanpa lokasi</span>`;
    return `<figure><figcaption>${cap}${score !== null && score !== undefined ? ` · ${score}%` : ""}</figcaption>
      ${p ? `<img class="photo" src="${p}" alt="${cap}">` : ""}${lok}</figure>`;
  };
  const html = cell(pi, "Foto masuk", r.inScore, r.inLat, r.inLon, r.inDist, r.inGeoFlag)
             + cell(po, "Foto pulang", r.outScore, r.outLat, r.outLon, r.outDist, r.outGeoFlag);
  box.innerHTML = html;
  if(!html) box.style.display = "none";

function saveEmp(id){
  const name = el("fn").value.trim();
  if(!name){ toast("Nama karyawan wajib diisi"); return; }
  const tolRaw = el("ft").value.trim();
  const pinRaw = el("fp").value.replace(/\D/g, "");
  if(pinRaw && pinRaw.length !== 4){ toast("PIN harus tepat 4 angka, atau biarkan kosong"); return; }
  const bentrok = pinRaw && db.employees.find(x => x.id !== id && pinOf(x) === pinRaw);
  if(bentrok){ toast(`PIN itu sudah dipakai ${bentrok.name} — pilih angka lain`); return; }
  const data = {
    name, role: el("fr").value.trim(), pin: pinRaw || null,
    tolerance: tolRaw === "" ? null : Math.max(0, Number(tolRaw)), active: formActive
  };
  if(id){
    const e = db.employees.find(x => x.id === id);
    Object.assign(e, data);
  }else{
    db.employees.push(Object.assign({ id:uid(), templates:[], avatar:null }, data));
  }
  recalcAll(); save(); closeSheet(); render(); toast(id ? "Data karyawan diperbarui" : `${name} ditambahkan`);
}
async function delEmp(id){
  const e = db.employees.find(x => x.id === id); if(!e) return;
  const cnt = db.records.filter(r => r.empId === id).length;
  if(!confirm(`Hapus ${e.name} beserta ${cnt} catatan absennya? Tindakan ini tidak bisa dibatalkan.`)) return;
  for(const r of db.records.filter(r => r.empId === id)){
    await photoDel(r.id + ":in"); await photoDel(r.id + ":out");
  }
  db.records = db.records.filter(r => r.empId !== id);
  db.employees = db.employees.filter(x => x.id !== id);
  for(const k of Object.keys(db.roster || {})) setRoster(k, id, null);
  save(); closeSheet(); render(); toast(`${e.name} dihapus`);
}

async function showUsage(){

async function pruneOld(silent){
  const days = Number(db.settings.retention || 0);
  if(!days) { if(!silent) toast("Retensi diatur selamanya — tidak ada yang dihapus"); return; }
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
  const ck = dkey(cutoff);
  let n = 0;
  for(const r of db.records){
    if(r.date < ck && (r.hasIn || r.hasOut)){
      if(r.hasIn){ await photoDel(r.id + ":in"); r.hasIn = false; n++; }
      if(r.hasOut){ await photoDel(r.id + ":out"); r.hasOut = false; n++; }
    }
  }
  if(n) save();
  if(!silent) toast(n ? `${n} foto lama dihapus` : "Tidak ada foto lama untuk dihapus");
  if(!silent) showUsage();
}

/* ---------- cadangan berisi foto ----------
   Versi sebelumnya hanya menyimpan db sebagai JSON, sedangkan foto tinggal di
   IndexedDB — jadi cadangan memulihkan angka tapi kehilangan seluruh bukti
   foto. Sekarang cadangan berbentuk zip: data.json plus satu berkas JPEG per
   foto, sehingga bisa juga dibuka langsung di PC tanpa aplikasi ini. */
const dataUrlToBytes = (u) => {
  const b64 = String(u).slice(String(u).indexOf(",") + 1);
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
};
const bytesToDataUrl = (b) => {
  let bin = "";
  for(let i=0;i<b.length;i++) bin += String.fromCharCode(b[i]);
  return "data:image/jpeg;base64," + btoa(bin);
};
const namaFoto = (rec, sisi) => `foto/${rec.date}_${rec.id}_${sisi === "in" ? "masuk" : "pulang"}.jpg`;

async function backup(){
  toast("Menyiapkan cadangan…");
  const files = [];
  const daftar = [];
  for(const r of db.records){
    for(const sisi of ["in","out"]){
      if(!(sisi === "in" ? r.hasIn : r.hasOut)) continue;
      const foto = await photoGet(r.id + ":" + sisi);
      if(!foto) continue;
      const nama = namaFoto(r, sisi);
      files.push({ name:nama, data:dataUrlToBytes(foto), simpanSaja:true });
      daftar.push({ rec:r.id, sisi, nama });
    }
  }
  const payload = JSON.stringify({ app:"absensi-cafe", version:2,
    exportedAt:new Date().toISOString(), fotoIndex:daftar, data:db }, null, 1);
  files.unshift({ name:"data.json", data:payload });
  files.push({ name:"BACA-SAYA.txt", data:
    `Cadangan Absensi Cafe\r\n\r\nBuka folder "foto" untuk melihat bukti absen, `
    + `dinamai menurut tanggal.\r\nBerkas "data.json" berisi pengaturan, karyawan, shift, `
    + `jadwal, dan catatan absen.\r\n\r\nUntuk memulihkan: buka aplikasi Absensi Cafe, `
    + `Setelan, lalu Pulihkan, dan pilih berkas zip ini.\r\n` });

  const bytes = await zipFiles(files);
  const ok = downloadBytes(`cadangan-absensi-${dkey()}.zip`, bytes, "application/zip");
  if(!ok) toast("Unduhan diblokir browser — buka aplikasi langsung di Chrome, bukan di dalam aplikasi lain");
  else toast(`Cadangan lengkap: ${daftar.length} foto disertakan`);
}

/* Pembaca zip untuk memulihkan cadangan. */
async function bacaZip(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.length);
  let eo = -1;
  for(let i = bytes.length - 22; i >= 0; i--) if(dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  if(eo < 0) throw new Error("bukan berkas zip");
  const jml = dv.getUint16(eo + 10, true);
  let p = dv.getUint32(eo + 16, true);
  const isi = {};
  for(let i = 0; i < jml; i++){
    const method = dv.getUint16(p + 10, true);
    const cs = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el2 = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    const nama = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nl));
    const lnl = dv.getUint16(off + 26, true), lel = dv.getUint16(off + 28, true);
    const mulai = off + 30 + lnl + lel;
    let data = bytes.subarray(mulai, mulai + cs);
    if(method === 8){
      const s = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      data = new Uint8Array(await new Response(s).arrayBuffer());
    }
    isi[nama] = data;
    p += 46 + nl + el2 + cl;
  }
  return isi;
}
/* Menerima cadangan zip berisi foto maupun cadangan JSON versi lama. */
async function restoreFile(file){
  try{
    const bytes = new Uint8Array(await file.arrayBuffer());
    const zip = bytes[0] === 0x50 && bytes[1] === 0x4B;
    let teks, isi = null;
    if(zip){
      isi = await bacaZip(bytes);
      if(!isi["data.json"]) throw new Error("zip tidak memuat data.json");
      teks = new TextDecoder().decode(isi["data.json"]);
    }else{
      teks = new TextDecoder().decode(bytes).replace(/^﻿/, "");
    }
    const p = JSON.parse(teks);
    const d = p && p.data ? p.data : p;
    if(!d || !Array.isArray(d.employees) || !Array.isArray(d.records))
      throw new Error("struktur tidak dikenali");

    const jmlFoto = isi ? Object.keys(isi).filter(n => n.startsWith("foto/")).length : 0;
    if(!confirm(`Ganti semua data saat ini dengan cadangan ini?\n\n`
      + `${d.employees.length} karyawan\n${d.records.length} catatan absen\n`
      + (zip ? `${jmlFoto} foto` : `tanpa foto (cadangan versi lama)`))) return;

    db.settings  = Object.assign({}, DEFAULTS.settings, d.settings || {});
    db.employees = d.employees;
    db.records   = d.records;
    db.shifts    = Array.isArray(d.shifts) && d.shifts.length ? d.shifts : [];
    db.roster    = (d.roster && typeof d.roster === "object") ? d.roster : {};
    // cadangan dari sebelum PIN jangan menyalakan lagi verifikasi wajah
    if(d.settings && d.settings.pinMode === undefined) db.settings.faceMode = "off";
    migrateToRoster(!d.shifts);          // cadangan versi lama ikut dikonversi

    let dipulihkan = 0;
    if(isi){
      const index = Array.isArray(p.fotoIndex) ? p.fotoIndex : [];
      for(const f of index){
        const data = isi[f.nama];
        if(!data) continue;
        await photoSet(f.rec + ":" + f.sisi, bytesToDataUrl(data));
        dipulihkan++;
      }
    }
    // catatan yang fotonya tidak ada di cadangan jangan mengaku punya foto
    for(const r of db.records){
      if(r.hasIn  && !(await photoGet(r.id + ":in")))  r.hasIn  = false;
      if(r.hasOut && !(await photoGet(r.id + ":out"))) r.hasOut = false;
    }
    recalcAll(); save(); render();
    toast(zip ? `Dipulihkan · ${dipulihkan} foto` : "Dipulihkan · cadangan lama, tanpa foto");
  }catch(e){
    toast("Berkas cadangan tidak dikenali: " + e.message);
  }
}
function resetAll(){
  if(!confirm("Hapus SEMUA karyawan, catatan absen, dan foto dari HP ini? Tindakan ini tidak bisa dibatalkan.")) return;
  if(!confirm("Yakin? Cadangkan dulu bila datanya masih dibutuhkan.")) return;

}
