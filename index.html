/* ============================================================
   PENULIS XLSX — ZIP + OOXML dirakit sendiri, tanpa library
   ============================================================ */
let crcTable = null;
function crc32(bytes){
  if(!crcTable){
    crcTable = new Uint32Array(256);
    for(let n=0; n<256; n++){
      let c = n;
      for(let k=0; k<8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      crcTable[n] = c >>> 0;
    }
  }
  let c = 0xFFFFFFFF;
  for(let i=0; i<bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function deflateRaw(bytes){
  if(typeof CompressionStream === "undefined") return null;
  try{
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    const buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  }catch(e){ return null; }   // browser lama: simpan tanpa kompresi
}
const utf8 = s => new TextEncoder().encode(s);

async function zipFiles(files){
  const enc = [];
  for(const f of files){
    const raw = typeof f.data === "string" ? utf8(f.data) : f.data;
    // JPEG sudah terkompresi; memampatkannya lagi hanya membakar waktu
    const comp = f.simpanSaja ? null : await deflateRaw(raw);
    enc.push({ name: utf8(f.name), raw, body: comp || raw, method: comp ? 8 : 0, crc: crc32(raw) });
  }
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  let size = 0;
  for(const e of enc) size += 30 + e.name.length + e.body.length + 46 + e.name.length;
  size += 22;
  const out = new Uint8Array(size);
  const dv = new DataView(out.buffer);
  let p = 0;
  const u16 = v => { dv.setUint16(p, v, true); p += 2; };
  const u32 = v => { dv.setUint32(p, v >>> 0, true); p += 4; };
  const raw = b => { out.set(b, p); p += b.length; };

  for(const e of enc){
    e.offset = p;
    u32(0x04034b50); u16(20); u16(0); u16(e.method); u16(dosTime); u16(dosDate);
    u32(e.crc); u32(e.body.length); u32(e.raw.length); u16(e.name.length); u16(0);
    raw(e.name); raw(e.body);
  }
  const cdStart = p;
  for(const e of enc){
    u32(0x02014b50); u16(20); u16(20); u16(0); u16(e.method); u16(dosTime); u16(dosDate);
    u32(e.crc); u32(e.body.length); u32(e.raw.length);
    u16(e.name.length); u16(0); u16(0); u16(0); u16(0); u32(0); u32(e.offset);
    raw(e.name);
  }
  const cdSize = p - cdStart;
  u32(0x06054b50); u16(0); u16(0); u16(enc.length); u16(enc.length); u32(cdSize); u32(cdStart); u16(0);
  return out.subarray(0, p);
}

const xmlEsc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&apos;" }[c]));
function colLetter(i){
  let s = "";
  for(i += 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + ((i - 1) % 26)) + s;
  return s;
}
/* indeks gaya di styles.xml */
const ST = { text:0, title:1, head:2, int:3, dec:4, money:5, coord:6,
             totText:7, totInt:8, totMoney:9, totDec:10 };
function styleFor(t, isTotal){
  const map = { s:"text", int:"int", dec:"dec", money:"money", coord:"coord" };
  const base = map[t] || "text";
  if(!isTotal) return ST[base];
  const tot = { text:"totText", int:"totInt", dec:"totDec", money:"totMoney", coord:"totInt" };
  return ST[tot[base]];
}
function cellXml(ref, v, col, isTotal){
  if(v === null || v === undefined || v === "") return "";
  const s = styleFor(col.t, isTotal);
  const numeric = col.t !== "s" && v !== "" && isFinite(Number(v));
  if(numeric) return `<c r="${ref}" s="${s}"><v>${Number(v)}</v></c>`;
  return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
}
function sheetXml(t){
  const cols = t.cols;
  const colsXml = `<cols>${cols.map((c,i) =>
    `<col min="${i+1}" max="${i+1}" width="${c.w}" customWidth="1"/>`).join("")}</cols>`;
  const body = [];
  body.push(`<row r="1" ht="28" customHeight="1">${cols.map((c,i) =>
    `<c r="${colLetter(i)}1" s="${ST.head}" t="inlineStr"><is><t>${xmlEsc(c.h)}</t></is></c>`).join("")}</row>`);
  let rn = 1;
  for(const r of t.rows){
    rn++;
    body.push(`<row r="${rn}">${r.map((v,i) => cellXml(colLetter(i)+rn, v, cols[i], false)).join("")}</row>`);
  }
  if(t.total){
    rn++;
    body.push(`<row r="${rn}">${t.total.map((v,i) =>
      cellXml(colLetter(i)+rn, v, cols[i], true)).join("")}</row>`);
  }
  const last = colLetter(cols.length - 1);
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
  + `<sheetViews><sheetView workbookViewId="0">`
  + `<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
  + `<sheetFormatPr defaultRowHeight="15"/>${colsXml}`
  + `<sheetData>${body.join("")}</sheetData>`
  + `<autoFilter ref="A1:${last}1"/></worksheet>`;
}

async function buildXLSX(){
  const tabs = [tableRekap(), tableDetail(), tableInfo()];
  const files = [
    { name:"[Content_Types].xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`
      + `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`
      + `<Default Extension="xml" ContentType="application/xml"/>`
      + `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`
      + tabs.map((_,i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")
      + `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`
      + `</Types>` },
    { name:"_rels/.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
      + `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>`
      + `</Relationships>` },
    { name:"xl/workbook.xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"`
      + ` xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>`
      + tabs.map((t,i) => `<sheet name="${xmlEsc(t.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")
      + `</sheets></workbook>` },
    { name:"xl/_rels/workbook.xml.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
      + tabs.map((_,i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")
      + `<Relationship Id="rId${tabs.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`
      + `</Relationships>` },
    { name:"xl/styles.xml", data: stylesXml() },
    ...tabs.map((t,i) => ({ name:`xl/worksheets/sheet${i+1}.xml`, data: sheetXml(t) }))
  ];
  const bytes = await zipFiles(files);
  const { label } = periodRange();
  return { bytes, name:`absensi-${label.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}.xlsx` };
}
async function exportXLSX(){

    const { bytes, name } = await buildXLSX();
    const ok = downloadBytes(name, bytes,
      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    if(!ok) toast("Unduhan diblokir browser — buka aplikasi langsung di Chrome, bukan di dalam aplikasi lain");
  }catch(e){
    toast("Gagal membuat file Excel: " + e.message);
  }
}
function downloadBytes(name, bytes, mime){
  try{
    const url = URL.createObjectURL(new Blob([bytes], { type:mime }));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 8000);
    toast("File diunduh: " + name);
    return true;
  }catch(e){ return false; }
}

document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("[data-act]");
  if(!t) return;
  const a = t.dataset.act, id = t.dataset.id;

  if(a === "scrim"){
    if(t !== ev.target && !t.classList.contains("btn")) return;
    closeSheet(); return;
  }
  if(a === "pinscrim"){
    if(t !== ev.target) return;
    closePin();
    const r = pinResolve; pinResolve = null; if(r) r(null);
    return;
  }
  switch(a){
    case "tab":
      activeTab = t.dataset.tab; filterQ = ""; render();
      if(activeTab === "admin" && adminUnlocked && adminSec === "setelan") showUsage();
      break;
    case "sortname":
      db.settings.sortDir = db.settings.sortDir === "desc" ? "asc" : "desc";
      save(); render();
      toast(`Urutan: ${sortLabel()}`);
      break;
    case "emp": openEmpSheet(id); break;
    case "go": {
      closeSheet();
      const emp = db.employees.find(e => e.id === id);
      if(!emp) break;
      // PIN diminta lebih dulu supaya kamera tidak menyala sia-sia
      const lolos = await gerbangPin(emp, t.dataset.mode);
      if(lolos === null) break;
      cam0EmpId = id;
      openCam({ mode:"absen", empId:id, action:t.dataset.mode, pinBy:lolos });
      break;
    }
    case "pin": pinKey(t.dataset.k); break;
    case "unlock": {
      const p = await askPin("PIN Admin", "Buka rekap, data karyawan, dan pengaturan");
      if(p === null) break;
      if(p === String(db.settings.pin)){ adminUnlocked = true; render(); if(adminSec === "setelan") showUsage(); }
      else toast("PIN salah");
      break;
    }
    case "lock": adminUnlocked = false; render(); toast("Area admin dikunci"); break;
    case "sec": adminSec = t.dataset.sec; render(); if(adminSec === "setelan") showUsage(); break;
    case "today": period = "today"; render(); break;

    /* --- jadwal --- */
    case "week": {
      const d = Number(t.dataset.d);
      weekStart = d === 0 ? mondayOf(new Date())
        : new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + d*7);
      render();
      break;
    }
    case "copyweek": copyLastWeek(); break;
    case "cell": openCellSheet(t.dataset.k, id); break;
    case "fillrow": openFillRow(id); break;
    case "fillday": openFillDay(t.dataset.k); break;
    case "setcell":
      applyRoster(t.dataset.k, id, t.dataset.v);
      recalcAll(); save(); closeSheet(); render();
      break;
    case "setrow": {
      weekDates(weekStart).forEach(k => applyRoster(k, id, t.dataset.v));
      recalcAll(); save(); closeSheet(); render();
      const e = db.employees.find(x => x.id === id);
      toast(`Jadwal seminggu ${e ? e.name : ""} diperbarui`);
      break;
    }
    case "setday": {
      const k = t.dataset.k;
      db.employees.filter(x => x.active !== false).forEach(x => applyRoster(k, x.id, t.dataset.v));
      recalcAll(); save(); closeSheet(); render();
      toast(`Jadwal ${shortDate(k)} diperbarui untuk semua karyawan`);
      break;
    }
    case "managesh": openShiftManager(); break;
    case "editsh": openShiftForm(id || null); break;
    case "savesh": saveShift(id || null); break;
    case "delsh": delShift(id); break;
    case "empdetail": openEmpDetail(id); break;
    case "editrec": openRecEdit(id); break;
    case "saverec": saveRecEdit(id); break;
    case "delrec": delRec(id); break;
    case "manual": openManual(); break;
    case "savemanual": saveManual(); break;
    case "newemp": openEmpForm(null); break;
    case "editemp": openEmpForm(id); break;
    case "saveemp": saveEmp(id); break;
    case "delemp": delEmp(id); break;
    case "togactive":
      formActive = !formActive;
      t.setAttribute("aria-pressed", String(formActive));
      break;
    case "enroll": {
      if(!id) break;
      cam0EmpId = id;
      closeSheet();
      openCam({ mode:"enroll", empId:id });
      break;
    }
    case "testface": closeSheet(); openCam({ mode:"test" }); break;
    case "camclose": closeCam(); if(activeTab === "admin" && adminSec === "karyawan" && cam0EmpId) openEmpForm(cam0EmpId); break;
    case "shoot": manualShoot(); break;
    case "retake": retake(); break;
    case "keepshot": keepShot(); break;
    case "override": overrideAdmin(); break;
    case "saveabsen": saveAbsen(); break;
    case "xlsx": exportXLSX(); break;
    case "togfine":
      db.settings.fineEnabled = !db.settings.fineEnabled;
      save(); render(); showUsage();
      break;
    case "addtier": {
      const ts = tiers();
      const last = ts[ts.length-1];
      const prev = ts.length > 1 ? Number(ts[ts.length-2].upTo) || 0 : 0;
      // sisipkan tingkatan baru tepat sebelum tingkatan "tanpa batas atas"
      ts.splice(ts.length-1, 0, { upTo: prev + 15, amount: Number(last.amount) || 0 });
      db.settings.fineTiers = ts;
      save(); render();
      break;
    }
    case "deltier": {
      const ts = tiers();
      if(ts.length <= 1) break;
      ts.splice(Number(t.dataset.i), 1);
      ts[ts.length-1].upTo = null;      // tingkatan terakhir selalu tanpa batas atas
      db.settings.fineTiers = ts;
      save(); render();
      break;
    }
    case "geohere": {
      toast("Mencari lokasi…");
      const p = await getPosition(20000);
      if(p.error){ toast(geoErrText[p.error]); break; }
      db.settings.geoLat = +p.lat.toFixed(6);
      db.settings.geoLon = +p.lon.toFixed(6);
      save(); render(); showUsage();
      toast(`Titik cafe disimpan · akurasi ±${p.acc} m`);
      break;
    }
    case "geotest": {
      toast("Mengukur jarak…");
      const p = await getPosition(20000);
      if(p.error){ toast(geoErrText[p.error]); break; }
      const jarak = jarakKeCafe(p);
      const r = Number(db.settings.geoRadius);
      sheet(`<h3>Uji Jarak</h3>
        <div class="sub">Posisi Anda sekarang terhadap titik cafe</div>
        <div class="score ${jarak <= r ? "pass" : "fail"}" style="color:var(--text)">
          <div class="pct" style="color:${jarak <= r ? "var(--ok)" : "var(--late)"}">${fmtJarak(jarak)}</div>
          <div class="vd" style="color:${jarak <= r ? "var(--ok)" : "var(--late)"}">
            ${jarak <= r ? "Di dalam area" : "Di luar area"}</div>
          <div class="accnote" style="color:var(--muted)">radius ${r} m · akurasi GPS ±${p.acc} m</div>
        </div>
        <div class="hint" style="margin:6px 0 14px">Ulangi beberapa kali dari titik-titik berbeda di dalam
          cafe. Ambil jarak terbesar yang muncul, lalu tambahkan margin akurasi GPS untuk menentukan radius.</div>
        <div class="btnrow"><button class="btn" data-act="geotest">Ukur Lagi</button>
          <button class="btn pri" data-act="scrim">Tutup</button></div>`);
      break;
    }
    case "mintapersist": {
      const s = await pastikanPenyimpananPermanen(true);
      render();
      toast(s === "aktif" ? "Penyimpanan permanen aktif — data absensi dilindungi"
        : s === "ditolak" ? "Browser menolak. Pasang aplikasi ke layar utama lebih dulu, lalu coba lagi"
        : "Browser ini tidak mendukung penyimpanan permanen");
      break;
    }
    case "perbarui": {
      if(!swReg){ toast("Mode luring belum aktif"); break; }
      toast("Memeriksa pembaruan…");
      try{ await swReg.update(); }catch(e){}
      const aktif = swReg.active || navigator.serviceWorker.controller;
      if(aktif) aktif.postMessage("segarkan");
      else toast("Belum ada service worker aktif — muat ulang halaman dulu");
      break;
    }
    case "changepin": changePin(); break;
    case "backup": backup(); break;
    case "prune": pruneOld(false); break;
    case "reset": resetAll(); break;
  }
});

/* input & perubahan nilai */
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if(t.id === "q"){ filterQ = t.value; const g = $(".grid"); if(g) rerenderGrid(); return; }
  if(t.dataset.act === "setting"){
    const k = t.dataset.k;
    let v = t.value;
    if(["tolerance","minOvertime","faceThreshold","retention","geoRadius"].includes(k)) v = Math.max(0, Number(v) || 0);
    if(k === "geoLat" || k === "geoLon") v = t.value.trim() === "" ? null : Number(t.value);
    db.settings[k] = v;
    save();
    if(k === "cafeName") el("cafeName").textContent = v || "Absensi Cafe";
    if(k === "faceThreshold"){
      const lab = t.previousElementSibling;
      if(lab && lab.tagName === "LABEL") lab.textContent = `Ambang kecocokan — ${v}%`;
    }
    if(k === "geoRadius"){
      const lab = t.previousElementSibling;
      if(lab && lab.tagName === "LABEL") lab.textContent = `Radius area — ${v} meter`;
    }
    if(["tolerance","minOvertime"].includes(k)) recalcAll();
    return;
  }
  if(t.dataset.act === "tier"){
    const i = Number(t.dataset.i), f = t.dataset.f;
    const ts = tiers();
    if(!ts[i]) return;
    ts[i][f] = f === "upTo" ? Math.max(1, Number(t.value) || 1) : Math.max(0, Number(t.value) || 0);
    save();
    // label tiap tingkatan bergantung pada batas tingkatan sebelumnya
    if(f === "upTo") ts.forEach((_,j) => { const L = el("tierlbl"+j); if(L) L.textContent = tierLabel(j); });
  }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if(t.dataset.act === "tier" && t.dataset.f === "upTo"){
    // rapikan urutan setelah selesai mengetik, agar tingkatan selalu menaik
    const ts = tiers();
    const open = ts[ts.length-1];
    const rest = ts.slice(0,-1).sort((a,b) => Number(a.upTo) - Number(b.upTo));
    db.settings.fineTiers = rest.concat([open]);
    save(); render();
    return;
  }
  if(t.dataset.act === "period" && t.value){ period = t.value; render(); return; }
  if(t.id === "restore" && t.files && t.files[0]){ restoreFile(t.files[0]); t.value = ""; return; }
  if(t.dataset.act === "setting" && t.tagName === "SELECT") render();
});
function rerenderGrid(){
  const view = el("view");
  const q = el("q");
  const pos = q ? q.selectionStart : null;
  view.innerHTML = viewAbsen();
  const q2 = el("q");
  if(q2){ q2.focus(); if(pos !== null) q2.setSelectionRange(pos, pos); }
}

/* ============================================================
   LURING & KETAHANAN DATA
   ============================================================ */
let swReg = null;
let luringSiap = false;
let persistStatus = "belum";   // aktif | belum | ditolak | tidak-didukung

async function pasangServiceWorker(){
  if(!("serviceWorker" in navigator) || !window.isSecureContext){
    luringSiap = "tidak-didukung";
    return;
  }
  try{
    swReg = await navigator.serviceWorker.register("sw.js");
    luringSiap = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { luringSiap = true; segarkanStatusLuring(); });
    navigator.serviceWorker.addEventListener("message", (e) => {
      if(e.data === "tersegarkan"){
        toast("Aplikasi diperbarui — tutup dan buka lagi untuk memakainya");
      }
    });
    // sesudah pemasangan pertama, cache siap begitu SW mengambil alih
    if(swReg.active && !navigator.serviceWorker.controller) luringSiap = true;
  }catch(e){
    luringSiap = false;
  }
  segarkanStatusLuring();
}

/* Tanpa ini Chrome boleh membuang localStorage dan IndexedDB saat memori
   HP sesak. Izin biasanya baru diberikan setelah aplikasi dipasang ke
   layar utama, jadi permintaan diulang tiap kali aplikasi dibuka. */
async function pastikanPenyimpananPermanen(diminta){
  if(!navigator.storage || !navigator.storage.persist){
    persistStatus = "tidak-didukung";
    return persistStatus;
  }
  try{
    if(await navigator.storage.persisted()){ persistStatus = "aktif"; }
    else { persistStatus = (await navigator.storage.persist()) ? "aktif" : (diminta ? "ditolak" : "belum"); }
  }catch(e){ persistStatus = "tidak-didukung"; }
  return persistStatus;
}
function segarkanStatusLuring(){
  if(activeTab === "admin" && adminSec === "setelan" && adminUnlocked && !el("layer").innerHTML) render();
}
const LABEL_LURING = { true:"Siap dipakai luring", false:"Belum tersimpan",
                       "tidak-didukung":"Tidak didukung browser ini" };
const LABEL_PERSIST = { aktif:"Aktif — data dilindungi", belum:"Belum diberikan",
                        ditolak:"Ditolak browser", "tidak-didukung":"Tidak didukung browser ini" };

/* ---------- mulai ---------- */
loadDB();
recalcAll();
render();
tickClock();
setInterval(tickClock, 1000);
pruneOld(true);
pasangServiceWorker();
pastikanPenyimpananPermanen(false).then(segarkanStatusLuring);
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && activeTab === "absen" && !cam && !el("layer").innerHTML) render();
});
